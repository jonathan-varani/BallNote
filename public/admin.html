<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BallNote — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="ball">🏀</span> BallNote U15</div>
  <nav>
    <a href="index.html">Joueurs</a>
    <a href="classement.html">Classement</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>
<main>
  <h1>Espace coach</h1>

  <div class="card" id="login-card">
    <label>Mot de passe admin</label><br><br>
    <input type="password" id="password" style="padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;max-width:300px;">
    <button class="btn" id="login-btn" style="margin-left:8px;">Entrer</button>
    <p id="login-error" class="msg err" style="display:none;margin-top:10px;"></p>
  </div>

  <div id="admin-area" style="display:none;">
    <div class="card">
      <h2 style="margin-top:0;">1. Choisir ou créer un match</h2>
      <label>Match existant</label>
      <select id="match-select" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0 16px;">
        <option value="">— Créer un nouveau match —</option>
      </select>

      <form class="admin-form" id="match-form">
        <div>
          <label>Date du match</label>
          <input type="date" name="date_match" required>
        </div>
        <div>
          <label>Adversaire</label>
          <input type="text" name="adversaire" placeholder="ex: ASPO Metz" required>
        </div>
        <div>
          <label>Lieu</label>
          <input type="text" name="lieu" placeholder="Domicile / Extérieur">
        </div>
        <div style="display:flex;gap:12px;">
          <div style="flex:1;">
            <label>Score équipe</label>
            <input type="number" name="score_equipe">
          </div>
          <div style="flex:1;">
            <label>Score adversaire</label>
            <input type="number" name="score_adversaire">
          </div>
        </div>
        <div>
          <label>Titre de la grille d'évaluation</label>
          <input type="text" name="grille_titre" placeholder="ex: Grille défense S3">
        </div>
        <div>
          <label>Critères de la grille (1 point par critère coché dans le tableau ci-dessous, 1 par ligne)</label>
          <textarea name="criteres_text" id="criteres_text" rows="10"></textarea>
        </div>
        <div>
          <label>Commentaire général sur le match</label>
          <textarea name="commentaire" rows="2"></textarea>
        </div>
        <button class="btn" type="submit">Créer ce match</button>
      </form>
      <p id="match-msg" style="margin-top:10px;"></p>
    </div>

    <div class="card" id="notes-card" style="display:none;">
      <h2 style="margin-top:0;">2. Cocher les critères réussis — <span id="notes-match-label"></span></h2>
      <form id="notes-form">
        <div style="overflow-x:auto;">
          <table id="notes-table" class="checklist-table"></table>
        </div>
        <button class="btn" type="submit" style="margin-top:16px;">Enregistrer les notes</button>
      </form>
      <p id="notes-msg" style="margin-top:10px;"></p>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let PASSWORD = sessionStorage.getItem("ballnote_admin_pw") || "";
let JOUEURS = [];
let MATCHS = [];
let CURRENT_MATCH = null;

const DEFAULT_CRITERES = [
  "Savoir quand fermer la ligne de passe",
  "Réussir à fermer la ligne de passe",
  "Tenir son duel dans l'axe",
  "Orienter son adversaire vers la ligne de fond (baseline)",
  "Se positionner en aide",
  "Intervenir en aide",
  "Se positionner en aide de l'aide",
  "Intervenir en aide de l'aide",
  "Laisser entrer la balle sur un côté",
  "Communiquer (balle/aide/aide de l'aide/mort)",
];
document.getElementById("criteres_text").value = DEFAULT_CRITERES.join("\n");

function showLoggedIn() {
  document.getElementById("login-card").style.display = "none";
  document.getElementById("admin-area").style.display = "block";
}

async function tryLogin(pw) {
  // On valide le mot de passe en tentant un appel protégé inoffensif.
  const res = await fetch(`${API_BASE}/api/notes`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": pw },
    body: JSON.stringify({ notes: [] }),
  });
  if (res.status === 401) return false;
  return true; // 400 "no notes provided" = mot de passe accepté
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const pw = document.getElementById("password").value;
  const err = document.getElementById("login-error");
  err.style.display = "none";
  const ok = await tryLogin(pw);
  if (!ok) {
    err.textContent = "Mot de passe incorrect.";
    err.style.display = "block";
    return;
  }
  PASSWORD = pw;
  sessionStorage.setItem("ballnote_admin_pw", pw);
  showLoggedIn();
  init();
});

async function init() {
  [JOUEURS, MATCHS] = await Promise.all([apiGet("/api/joueurs"), apiGet("/api/matchs")]);
  JOUEURS.sort((a, b) => (a.prenom || "").localeCompare(b.prenom || ""));

  const select = document.getElementById("match-select");
  MATCHS.slice().reverse().forEach((m) => {
    const opt = document.createElement("option");
    opt.value = m.Id;
    opt.textContent = `${formatDate(m.date_match)} vs ${m.adversaire || "?"}`;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    if (select.value) {
      const m = MATCHS.find((x) => x.Id === Number(select.value));
      openNotesFor(m);
    } else {
      document.getElementById("notes-card").style.display = "none";
    }
  });
}

document.getElementById("match-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("match-msg");
  msg.textContent = "Création en cours…";
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  body.criteres = (body.criteres_text || "")
    .split("\n")
    .map((s) => s.trim())
    .filter(Boolean);
  delete body.criteres_text;
  if (body.criteres.length === 0) {
    msg.innerHTML = `<span style="color:#d33;">Ajoute au moins un critère à la grille.</span>`;
    return;
  }
  try {
    const created = await apiPost("/api/matchs", body, PASSWORD);
    msg.innerHTML = `<span style="color:#1f9d55;">Match créé ✔</span>`;
    MATCHS.push(created);
    const opt = document.createElement("option");
    opt.value = created.Id;
    opt.textContent = `${formatDate(created.date_match)} vs ${created.adversaire || "?"}`;
    const select = document.getElementById("match-select");
    select.insertBefore(opt, select.children[1]);
    select.value = created.Id;
    openNotesFor(created);
  } catch (err) {
    msg.innerHTML = `<span style="color:#d33;">Erreur : ${err.message}</span>`;
  }
});

function parseCriteres(match) {
  try {
    const arr = JSON.parse(match.criteres || "[]");
    return Array.isArray(arr) ? arr : [];
  } catch {
    return [];
  }
}

function openNotesFor(match) {
  CURRENT_MATCH = match;
  document.getElementById("notes-card").style.display = "block";
  document.getElementById("notes-match-label").textContent = `${formatDate(match.date_match)} vs ${match.adversaire || "?"}`;
  const criteres = parseCriteres(match);
  const table = document.getElementById("notes-table");

  let thead = `<tr><th style="min-width:140px;">Joueur</th>`;
  criteres.forEach((c, i) => (thead += `<th title="${c}">C${i + 1}</th>`));
  thead += `<th>Total</th></tr>`;

  let rows = "";
  JOUEURS.forEach((j) => {
    rows += `<tr data-joueur-id="${j.id}" data-prenom="${j.prenom}" data-nom="${j.nom}">`;
    rows += `<td class="pname">${j.prenom} ${j.nom}</td>`;
    criteres.forEach((c, i) => {
      rows += `<td style="text-align:center;"><input type="checkbox" data-critere-index="${i}" data-critere-label="${c.replace(/"/g, "&quot;")}"></td>`;
    });
    rows += `<td class="row-total" style="text-align:center;font-weight:700;">0</td></tr>`;
  });

  table.innerHTML = `<thead>${thead}</thead><tbody>${rows}</tbody>`;

  table.querySelectorAll("tbody tr").forEach((tr) => {
    const total = tr.querySelector(".row-total");
    tr.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.addEventListener("change", () => {
        total.textContent = tr.querySelectorAll("input:checked").length;
      });
    });
  });

  // Rappel de la grille sous le tableau
  const legend = criteres.map((c, i) => `C${i + 1} = ${c}`).join(" · ");
  let legendEl = document.getElementById("criteres-legend");
  if (!legendEl) {
    legendEl = document.createElement("p");
    legendEl.id = "criteres-legend";
    legendEl.style.cssText = "font-size:0.8rem;color:#6b7280;margin-top:10px;";
    table.insertAdjacentElement("afterend", legendEl);
  }
  legendEl.textContent = legend;
}

document.getElementById("notes-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("notes-msg");
  if (!CURRENT_MATCH) return;
  const rows = document.querySelectorAll("#notes-table tbody tr");
  const notes = [];
  rows.forEach((tr) => {
    const checkboxes = tr.querySelectorAll("input[type=checkbox]");
    const checked = Array.from(checkboxes).filter((cb) => cb.checked);
    if (checked.length === 0) return; // joueur non noté sur ce match (ex: absent)
    const details = {};
    checkboxes.forEach((cb) => { details[cb.dataset.critereLabel] = cb.checked; });
    notes.push({
      match_id: CURRENT_MATCH.Id,
      joueur_id: Number(tr.dataset.joueurId),
      joueur_nom: tr.dataset.nom,
      joueur_prenom: tr.dataset.prenom,
      note: checked.length,
      details,
    });
  });
  if (notes.length === 0) {
    msg.innerHTML = `<span style="color:#d33;">Coche au moins un critère pour au moins un joueur.</span>`;
    return;
  }
  msg.textContent = "Enregistrement…";
  try {
    await apiPost("/api/notes", { notes }, PASSWORD);
    msg.innerHTML = `<span style="color:#1f9d55;">${notes.length} note(s) enregistrée(s) ✔</span>`;
  } catch (err) {
    msg.innerHTML = `<span style="color:#d33;">Erreur : ${err.message}</span>`;
  }
});

if (PASSWORD) {
  tryLogin(PASSWORD).then((ok) => {
    if (ok) { showLoggedIn(); init(); }
    else sessionStorage.removeItem("ballnote_admin_pw");
  });
}
</script>
</body>
</html>
