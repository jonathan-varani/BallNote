<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BallNote — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="ball">🏀</span> BallNote U15</div>
  <nav>
    <a href="index.html">Joueurs</a>
    <a href="classement.html">Classement</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>
<main>
  <h1>Espace coach — Créer un match</h1>

  <div class="card" id="login-card">
    <label>Mot de passe admin</label><br><br>
    <input type="password" id="password" style="padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;max-width:300px;">
    <button class="btn" id="login-btn" style="margin-left:8px;">Entrer</button>
    <p id="login-error" class="msg err" style="display:none;margin-top:10px;"></p>
  </div>

  <div id="admin-area" style="display:none;">
    <div class="card">
      <form class="admin-form" id="match-form">
        <div>
          <label>Date du match</label>
          <input type="date" name="date_match" required>
        </div>
        <div>
          <label>Adversaire</label>
          <input type="text" name="adversaire" placeholder="ex: ASPO Metz" required>
        </div>
        <div>
          <label>Lieu</label>
          <input type="text" name="lieu" placeholder="Domicile / Extérieur">
        </div>
        <div style="display:flex;gap:12px;">
          <div style="flex:1;">
            <label>Score équipe</label>
            <input type="number" name="score_equipe">
          </div>
          <div style="flex:1;">
            <label>Score adversaire</label>
            <input type="number" name="score_adversaire">
          </div>
        </div>
        <div>
          <label>Titre de la grille d'évaluation</label>
          <input type="text" name="grille_titre" placeholder="ex: Grille défense S3">
        </div>
        <div>
          <label>Critères de la grille (1 point par critère, 1 critère par ligne — modifiable si la grille évolue)</label>
          <textarea name="criteres_text" id="criteres_text" rows="10"></textarea>
        </div>
        <div>
          <label>Commentaire général sur le match</label>
          <textarea name="commentaire" rows="2"></textarea>
        </div>
        <button class="btn" type="submit">Enregistrer le match</button>
      </form>
      <p id="match-msg" style="margin-top:10px;"></p>
    </div>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const DEFAULT_CRITERES = [
  "Savoir quand fermer la ligne de passe",
  "Réussir à fermer la ligne de passe",
  "Tenir son duel dans l'axe",
  "Orienter son adversaire vers la ligne de fond (baseline)",
  "Se positionner en aide",
  "Intervenir en aide",
  "Se positionner en aide de l'aide",
  "Intervenir en aide de l'aide",
  "Laisser entrer la balle sur un côté",
  "Communiquer (balle/aide/aide de l'aide/mort)",
];
document.getElementById("criteres_text").value = DEFAULT_CRITERES.join("\n");

let PASSWORD = "";

document.getElementById("match-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("match-msg");
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  body.criteres = (body.criteres_text || "")
    .split("\n")
    .map((s) => s.trim())
    .filter(Boolean);
  delete body.criteres_text;
  if (body.criteres.length === 0) {
    msg.innerHTML = `<span style="color:#d33;">Ajoute au moins un critère à la grille.</span>`;
    return;
  }
  msg.textContent = "Enregistrement…";
  try {
    const created = await apiPost("/api/matchs", body, PASSWORD);
    msg.innerHTML = `<span style="color:#1f9d55;">Match enregistré ✔ — <a href="admin-notes.html?match=${created.Id}">saisir les notes de ce match</a></span>`;
    e.target.reset();
    document.getElementById("criteres_text").value = DEFAULT_CRITERES.join("\n");
  } catch (err) {
    msg.innerHTML = `<span style="color:#d33;">Erreur : ${err.message}</span>`;
  }
});

setupAdminLogin((pw) => { PASSWORD = pw; });
</script>
</body>
</html>
